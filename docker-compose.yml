services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: soccer}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
  api:
    build: ./api
    environment: &env
      DATABASE_URL: postgresql://postgres:postgres@db:5432/soccer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    volumes: ["./data:/data:ro", "./db:/db:ro"]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
  go-api:
    build: ./go-api
    environment: {<<: *env, CORS_ORIGIN: "*"}
    ports: ["8080:8080"]
    depends_on: [api]
